<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Sensory Lyrics">
  <defs>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d95"/>
      <stop offset="52%" stop-color="#b24bff"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Maskable-safe background (full bleed) -->
  <rect width="512" height="512" rx="108" fill="#050508"/>
  <rect width="512" height="512" rx="108" fill="url(#glow)"/>
  <!-- Pulse ring -->
  <circle cx="256" cy="256" r="178" fill="none" stroke="url(#neon)" stroke-width="10" opacity="0.55"/>
  <circle cx="256" cy="256" r="142" fill="url(#neon)" opacity="0.22"/>
  <!-- Lyric bars + bite curve -->
  <g filter="url(#soft)">
    <rect x="148" y="198" width="72" height="12" rx="6" fill="#fff" opacity="0.92"/>
    <rect x="148" y="232" width="116" height="12" rx="6" fill="#fff" opacity="0.78"/>
    <rect x="148" y="266" width="92" height="12" rx="6" fill="#fff" opacity="0.88"/>
    <path d="M292 286c38 0 68 28 68 62 0 20-10 38-26 48" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"/>
    <!-- Fang accent -->
    <path d="M318 332l14 28 14-28z" fill="#00f5ff"/>
    <path d="M346 332l10 22 10-22z" fill="#ff2d95"/>
  </g>
  <!-- Active word dot -->
  <circle cx="272" cy="204" r="10" fill="#00f5ff"/>
</svg>
