name: Deploy to GitHub Pages

# Publishes lyrics-app/out (includes index.html) to https://kruffy12.github.io/ADHD-Lyrics/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lyrics-app/package-lock.json

      - name: Install
        working-directory: lyrics-app
        run: npm ci

      - name: Build static export
        working-directory: lyrics-app
        env:
          # Project site: https://<user>.github.io/<repo>/
          NEXT_PUBLIC_BASE_PATH: /ADHD-Lyrics
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: lyrics-app/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
